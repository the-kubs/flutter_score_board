plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Mengambil nilai dari file .env
def flutterVersionName = 'v1.2.4'
def flutterVersionCode = 8
def flutterCompileSdk = 34

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.example.scorre_board_flutter"
    compileSdk flutterCompileSdk.toInteger()
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        buildConfigField "String", "FLUTTER_VERSION_NAME", "\"${flutterVersionName}\""
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.karyayudi.score_board_flutter_free"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 28
        targetSdkVersion flutterCompileSdk.toInteger()
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }
    

    tasks.whenTaskAdded { task ->
    if (task.name == "bundleRelease") {
        task.doLast {
                println "Mengganti  ${buildDir}"
            def bundleDir = file("${buildDir}/outputs/bundle/release")
            def originalFile = bundleDir.listFiles().find { it.name.endsWith(".aab") }
            if (originalFile) {
                def appId = android.defaultConfig.applicationId
                def versionName = android.defaultConfig.versionName
                def versionCode = android.defaultConfig.versionCode
                def newFileName = "${appId}-v${versionName}-${versionCode}.aab"
                def newFile = new File(bundleDir, newFileName)

                println "Mengganti nama file ${originalFile.name} menjadi ${newFileName}"
                originalFile.renameTo(newFile)
            }
        }
    }
}


    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release
            
            applicationVariants.all { variant ->
                variant.outputs.all { output ->
                    // Mendapatkan applicationId, versionName, dan versionCode
                    def appId = variant.applicationId
                    def versionName = variant.versionName
                    def versionCode = variant.versionCode

                    // Menentukan format nama file
                    def fileName = "${appId}-v${versionName}-${versionCode}.apk"
                    outputFileName = fileName
                }
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:22.4.0' // Versi terbaru
}
